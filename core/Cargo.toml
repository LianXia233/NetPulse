[package]
name = "netpulse_core"
version = "0.1.0"
edition = "2021"
description = "NetPulse Rust core: multi-CDN / multi-DNS throughput engine, downloader, diagnostics"

[lib]
name = "netpulse_core"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
libc = "0.2"
flate2 = "1"
aes = "0.8"
cbc = "0.1"
regex = "1"
idna = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# 保留 unwind：FFI 入口与任务线程统一用 catch_unwind 兜底，
# 避免单个 panic 直接终止整个 App。
panic = "unwind"
