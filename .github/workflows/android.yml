name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: 即使同版本 Release 已存在也重新发布
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core

      - name: Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Flutter analyze
        run: |
          cd app
          flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: |
          cd app
          flutter test

      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

  build:
    name: Build signed APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version from pubspec
        id: meta
        run: |
          set -euo pipefail
          RAW=$(sed -n 's/^version:\s*//p' app/pubspec.yaml | head -1 | tr -d '\r')
          VERSION="${RAW%%+*}"
          VERSION_CODE="${RAW#*+}"
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 app/pubspec.yaml 读取版本号"
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec.yaml 版本号缺少 +versionCode"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION (versionCode $VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d /usr/local/lib/android/sdk ]; then
              ANDROID_HOME=/usr/local/lib/android/sdk
            else
              ANDROID_HOME="${ANDROID_SDK_ROOT:?Android SDK not found}"
            fi
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          CMDLINE=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          if [ -n "$CMDLINE" ]; then
            echo "Found sdkmanager: $CMDLINE"
            echo "$(dirname "$CMDLINE")" >> "$GITHUB_PATH"
          else
            echo "::error::sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

      - name: Install Android platform / build tools / NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" >/dev/null

      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core

      - name: Restore release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，无法生成与本地一致的签名包"
            exit 1
          fi
          mkdir -p app/android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/netpulse-release.jks
          cat > app/android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=netpulse-release.jks
          EOF

      - name: Get Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Rust core and signed APK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bash tools/build.sh

      - name: Verify release certificate and checksum
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APK="$(ls -1 dist/*.apk | tail -1)"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > /tmp/apk-certs.txt
          cat /tmp/apk-certs.txt
          grep -Fq "SHA-256 digest: 118ea38fc17a465dce8fe2c7657d0b4d3c7273e6379f3a0a9b73f5f80a106d6b" /tmp/apk-certs.txt
          sha256sum "$APK" | tee dist/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NetPulse-APK-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NetPulse-APK-${{ github.run_number }}
          path: release

      - name: Publish official release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # push 构建如果同版本 Release 已存在就跳过，避免每次提交覆盖已发布资产
          # （会导致旧 APK 的 SHA256 立即失效、tag 仍指向旧提交）。
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$FORCE_RELEASE" != "true" ]; then
              echo "Release $TAG 已存在，跳过重复发布（需要覆盖请手动运行并勾选 force_release）"
              exit 0
            fi
          fi
          APK="$(ls -1 release/*.apk | head -1)"
          APK_SHA="$(cut -d' ' -f1 release/SHA256.txt)"
          CERT_SHA="118ea38fc17a465dce8fe2c7657d0b4d3c7273e6379f3a0a9b73f5f80a106d6b"
          echo "$APK_SHA  $APK" | sha256sum -c -
          SHA_FILE="release/NetPulse-${VERSION}.sha256"
          mv release/SHA256.txt "$SHA_FILE"

          NOTES=$(cat <<EOF
          NetPulse ${VERSION} 正式版

          - 版本：${VERSION}（versionCode ${VERSION_CODE}）
          - 构建提交：${GITHUB_SHA}
          - APK SHA-256：${APK_SHA}
          - 签名证书 SHA-256：${CERT_SHA}

          安装包与 SHA-256 校验文件已附在本 Release。
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "NetPulse ${VERSION}" --notes "$NOTES" --draft=false --prerelease=false
            gh release upload "$TAG" "$APK" "$SHA_FILE" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA_FILE" \
              --target "$GITHUB_SHA" \
              --title "NetPulse ${VERSION}" \
              --notes "$NOTES" \
              --draft=false \
              --prerelease=false
          fi
