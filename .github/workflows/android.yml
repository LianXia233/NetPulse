name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d /usr/local/lib/android/sdk ]; then
              ANDROID_HOME=/usr/local/lib/android/sdk
            else
              ANDROID_HOME="${ANDROID_SDK_ROOT:?Android SDK not found}"
            fi
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          CMDLINE=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          if [ -n "$CMDLINE" ]; then
            echo "Found sdkmanager: $CMDLINE"
            echo "$(dirname "$CMDLINE")" >> "$GITHUB_PATH"
          else
            echo "::error::sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

      - name: Install Android platform / build tools / NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" >/dev/null

      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Restore release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，无法生成与本地一致的签名包"
            exit 1
          fi
          mkdir -p app/android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/netpulse-release.jks
          cat > app/android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=netpulse-release.jks
          EOF

      - name: Get Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Rust core and signed APK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bash tools/build.sh

      - name: Verify release certificate and checksum
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APK="$(ls -1 dist/*.apk | tail -1)"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > /tmp/apk-certs.txt
          cat /tmp/apk-certs.txt
          grep -Fq "SHA-256 digest: 118ea38fc17a465dce8fe2c7657d0b4d3c7273e6379f3a0a9b73f5f80a106d6b" /tmp/apk-certs.txt
          sha256sum "$APK" | tee dist/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-APK-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
