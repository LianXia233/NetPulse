name: netpulse
description: "NetPulse · Flutter + Rust 重构版"
publish_to: 'none'
version: 1.5.3+27

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plugins/index.json
    - assets/plugins/NOTICE.md
    - assets/plugins/m3u8-pro/
    - assets/plugins/github-accel/
    - assets/plugins/quark-share/
    - assets/plugins/accountdl/
    - assets/plugins/accountdl/page/
    - assets/plugins/musicdl/
    - assets/plugins/bilibili/
    - assets/plugins/anime-sites/
    - assets/plugins/linkswift/
    - assets/plugins/linkswift/vendor/
    - assets/userscript/
